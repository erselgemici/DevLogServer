<div class="col-lg-8">
  <form #sendMessageForm="ngForm" (ngSubmit)="sendMessage()" class="php-email-form">
    <div class="row gy-4">

      <div class="col-md-6">
        <input type="text" name="name" [(ngModel)]="newMessage.name" class="form-control" [placeholder]="'contact.name' | t" required>
      </div>

      <div class="col-md-6">
        <input type="email" class="form-control" name="email" [(ngModel)]="newMessage.email" [placeholder]="'contact.yourEmail' | t" required>
      </div>

      <div class="col-md-12">
        <input type="text" class="form-control" name="subject" [(ngModel)]="newMessage.subject" [placeholder]="'contact.subject' | t" required>
      </div>

      <div class="col-md-12">
        <textarea class="form-control" name="messageBody" [(ngModel)]="newMessage.messageBody" rows="6" [placeholder]="'contact.message' | t" required></textarea>
      </div>

      <div class="col-md-12 text-center">
        <button type="submit" [disabled]="sendMessageForm.invalid">{{ 'contact.send' | t }}</button>
      </div>

    </div>
  </form>
</div>
