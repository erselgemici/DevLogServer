<h3>{{ 'admin.users' | t }}</h3>

<table class="table table-hover align-middle">
  <thead>
    <tr>
      <th>#</th>
      <th>{{ 'admin.name' | t }}</th>
      <th>{{ 'admin.email' | t }}</th>
      <th>{{ 'admin.blogCount' | t }}</th>
      <th>{{ 'admin.role' | t }}</th>
    </tr>
  </thead>
  <tbody>
    @for (item of users; track item.id; let i = $index) {
      <tr>
        <th>{{ i + 1 }}</th>
        <td>
          <img [src]="item.imageUrl || 'assets/img/blog/blog-author.jpg'" class="user-avatar me-2" alt="">
          {{ item.firstName }} {{ item.lastName }}
        </td>
        <td>{{ item.email }}</td>
        <td>{{ item.blogCount }}</td>
        <td>
          <!-- admin kendi rolünü değiştiremiyor -->
          <select class="form-select form-select-sm role-select" [ngModel]="item.role" (ngModelChange)="changeRole(item, $event)" [disabled]="item.id === currentUserId">
            @for (role of roles; track role) {
              <option [value]="role">{{ ('role.' + role) | t }}</option>
            }
          </select>
        </td>
      </tr>
    }
  </tbody>
</table>
