<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#g)"/>
<rect x="60" y="50" width="1080" height="530" rx="16" fill="#1e1e2e"/>
<circle cx="100" cy="88" r="9" fill="#ff5f57"/><circle cx="130" cy="88" r="9" fill="#febc2e"/><circle cx="160" cy="88" r="9" fill="#28c840"/>
<text x="600" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#a6adc8" text-anchor="middle">Counter.swift / Counter.kt</text>
<text x="100" y="160" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 1</text>
<text x="150" y="160" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#6c7086" xml:space="preserve">// SwiftUI</text>
<text x="100" y="204" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 2</text>
<text x="150" y="204" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">@State private var count = 0</text>
<text x="100" y="248" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 3</text>
<text x="150" y="248" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">Button("Count: \(count)") { count += 1 }</text>
<text x="100" y="292" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 4</text>
<text x="150" y="292" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve"></text>
<text x="100" y="336" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 5</text>
<text x="150" y="336" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#6c7086" xml:space="preserve">// Jetpack Compose</text>
<text x="100" y="380" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 6</text>
<text x="150" y="380" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">var count by remember { mutableStateOf(0) }</text>
<text x="100" y="424" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 7</text>
<text x="150" y="424" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">Button(onClick = { count++ }) { Text("Count: $count") }</text>
</svg>