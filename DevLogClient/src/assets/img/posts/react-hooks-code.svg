<circle cx="100" cy="88" r="9" fill="#ff5f57"/><circle cx="130" cy="88" r="9" fill="#febc2e"/><circle cx="160" cy="88" r="9" fill="#28c840"/>
<text x="600" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#a6adc8" text-anchor="middle">useFetch.js</text>
<text x="100" y="160" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 1</text>
<text x="150" y="160" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">function useFetch(url) {</text>
<text x="100" y="204" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 2</text>
<text x="150" y="204" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">  const [data, setData] = useState(null);</text>
<text x="100" y="248" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 3</text>
<text x="150" y="248" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">  const [loading, setLoading] = useState(true);</text>
<text x="100" y="292" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 4</text>
<text x="150" y="292" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve"></text>
<text x="100" y="336" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 5</text>
<text x="150" y="336" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">  useEffect(() =&gt; {</text>
<text x="100" y="380" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 6</text>
<text x="150" y="380" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">    fetch(url).then(r =&gt; r.json())</text>
<text x="100" y="424" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 7</text>
<text x="150" y="424" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">      .then(setData).finally(() =&gt; setLoading(false));</text>
<text x="100" y="468" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 8</text>
<text x="150" y="468" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">  }, [url]);</text>
<text x="100" y="512" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a"> 9</text>
<text x="150" y="512" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve"></text>
<text x="100" y="556" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a">10</text>
<text x="150" y="556" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">  return { data, loading };</text>
<text x="100" y="600" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="22" fill="#45475a">11</text>
<text x="150" y="600" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" fill="#cdd6f4" xml:space="preserve">}</text>
</svg>